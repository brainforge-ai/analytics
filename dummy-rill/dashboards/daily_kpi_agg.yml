type: metrics_view

title: Daily KPIs
model: prod_daily_kpi_agg_model
timeseries: DATE_DAY

dimensions:
  - label: Day
    column: DAY_NAME
    description: ""
  - label: "Week"
    expression: "EXTRACT(WEEK FROM DATE_DAY)"
    description: ""
  - label: "Month"
    expression: "EXTRACT(MONTH FROM DATE_DAY)"
    description: ""
  - label: "Year"
    expression: "EXTRACT(YEAR FROM DATE_DAY)"  
    description: ""
  - label: "Quarter"
    expression: "EXTRACT(QUARTER FROM DATE_DAY)"  
    description: ""  
  - label: "App Source"
    column: app_source
    description: ""  
    
measures:
