type: metrics_view

title: Reviews Dashboard
model: prod_fact_reviews_model
timeseries: date_created

dimensions:
  - name: product_id
    label: Product ID
    expression: product_id

  - name: product_name
    label: Product Name
    expression: product_name

  - name: rating
    label: Rating
    expression: rating

  - name: is_recommended
    label: Is Recommended
    expression: is_recommended

  - name: status
    label: Review Status
    expression: status

  - name: use_dummyclient_everyday
    label: Uses dummyclient Every Day
    expression: use_dummyclient_everyday

  - name: dummyclient_usage_frequency
    label: dummyclient Usage Frequency
    expression: dummyclient_usage_frequency

  - name: shipping_feedback
    label: Shipping Feedback
    expression: shipping_feedback

  - name: product_taste_feedback
    label: Product Taste Feedback
    expression: product_taste_feedback

  - name: contains_profanity
    label: Contains Profanity
    expression: contains_profanity

  - name: number_of_images
    label: Number of Images
    expression: number_of_images

  - name: number_of_videos
    label: Number of Videos
    expression: number_of_videos

  - name: number_of_audio_files
    label: Number of Audio Files
    expression: number_of_audio_files

  - name: total_media_count
    label: Total Media Count
    expression: total_media_count

measures:
  - name: total_reviews
    label: Total Reviews
    expression: count(*)
    format_preset: humanize
    valid_percent_of_total: true

  - name: average_rating
    label: Average Rating
    expression: avg(rating)
    format_preset: humanize

  - name: average_helpful_votes
    label: Average Helpful Votes
    expression: avg(helpful_count)
    format_preset: humanize

  - name: total_helpful_votes
    label: Total Helpful Votes
    expression: sum(helpful_count)
    format_preset: humanize
    valid_percent_of_total: true

  - name: total_unhelpful_votes
    label: Total Unhelpful Votes
    expression: sum(unhelpful_count)
    format_preset: humanize
    valid_percent_of_total: true

  - name: percent_recommended
    label: Percentage Recommended
    expression: 100.0 * sum(case when is_recommended = true then 1 else 0 end) / count(*)
    format_preset: humanize
    valid_percent_of_total: true

  - name: total_media_attachments
    label: Total Media Attachments
    expression: sum(total_media_count)
    format_preset: humanize
    valid_percent_of_total: true

  - name: average_media_attachments
    label: Average Media Attachments per Review
    expression: avg(total_media_count)
    format_preset: humanize
