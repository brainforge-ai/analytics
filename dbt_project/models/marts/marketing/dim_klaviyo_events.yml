models:
  - name: dim_klaviyo_events
    description: "Dimension table for Klaviyo events with enhanced email engagement tracking and campaign attribution capabilities."
    columns:
      - name: event_id
        description: "Unique identifier for the event (Klaviyo's internal ID)"
        meta:
          dimension:
            type: string
            primary_key: true
            
      - name: profile_id
        description: "ID of the profile associated with this event (links to dim_klaviyo_profiles)"
        meta:
          dimension:
            type: string
            foreign_key: dim_klaviyo_profiles.profile_id
            
      - name: metric_id
        description: "Type of event (links to dim_klaviyo_metrics)"
        meta:
          dimension:
            type: string
            foreign_key: dim_klaviyo_metrics.metric_id

      - name: event_datetime
        description: "Timestamp of when the event occurred in local timezone"
        meta:
          dimension:
            type: datetime
            
      - name: event_timestamp
        description: "Processing timestamp when Klaviyo recorded the event"
        meta:
          dimension:
            type: datetime
            
      - name: event_timestamp_unix
        description: "Unix timestamp of when the event occurred"
        meta:
          dimension:
            type: number

      - name: message_id
        description: "Identifier of the specific message that triggered this event"
        meta:
          dimension:
            type: string
            
      - name: campaign_name
        description: "Human-readable name of the campaign or flow"
        meta:
          dimension:
            type: string
            category: "Campaign"
            
      - name: is_from_flow
        description: "Whether this event came from an automation flow (vs a one-time campaign)"
        meta:
          dimension:
            type: boolean
            filter_group: "Message Type"
            
      - name: flow_id
        description: "For automation flows, the identifier of the specific flow"
        meta:
          dimension:
            type: string

      - name: recipient_email
        description: "Email address of the recipient (key for order attribution)"
        meta:
          dimension:
            type: string
            
      - name: email_subject
        description: "Subject line of the email that triggered this event"
        meta:
          dimension:
            type: string
            
      - name: message_type
        description: "Classification of message source (Campaign, Automation Flow, or Other)"
        meta:
          dimension:
            type: string
            category: "Message Type"

      - name: sending_domain
        description: "Domain used to send the email"
        meta:
          dimension:
            type: string
            category: "Technical"
            
      - name: email_domain
        description: "Domain portion of recipient's email address"
        meta:
          dimension:
            type: string
            category: "Technical"
            
      - name: inbox_provider
        description: "Raw value of the email service provider that received the message"
        meta:
          dimension:
            type: string
            
      - name: user_agent
        description: "Device/client that interacted with the email"
        meta:
          dimension:
            type: string
            category: "Technical"
            
      - name: is_machine_open
        description: "Whether the open event was likely generated by a machine/bot"
        meta:
          dimension:
            type: boolean
            filter_group: "Engagement Quality"

      - name: open_agent_type
        description: "Classification of opens as Human or Machine-generated"
        meta:
          dimension:
            type: string
            category: "Engagement Quality"
            
      - name: inbox_category
        description: "Grouped classification of inbox providers for deliverability analysis"
        meta:
          dimension:
            type: string
            category: "Deliverability"
            values:
              - "Major Provider"
              - "Apple Mail"
              - "ISP"
              - "Business/Enterprise"
              - "Regional Provider"
              - "Other Provider"
              - "Security/Filtering"
              - "Unknown"
              - "Other"

      - name: send_cohort_id
        description: "Identifier for the batch/send group this event belongs to"
        meta:
          dimension:
            type: string
            
      - name: cohort_handoff_time
        description: "Unix timestamp when the message was handed off to the sending service"
        meta:
          dimension:
            type: number
            
      - name: cohort_message_id
        description: "Specific message identifier within the send cohort"
        meta:
          dimension:
            type: string

      - name: event_value
        description: "Numeric value associated with the event (e.g., order amount)"
        meta:
          dimension:
            type: number
            unit: "USD"

      - name: event_properties_json_from_attributes_raw
        description: "Raw JSON of event properties from Klaviyo API"
        meta:
          dimension:
            type: json
            
      - name: attributes_column_raw
        description: "Complete raw attributes JSON from source"
        meta:
          dimension:
            type: json
            
      - name: relationships_column_raw
        description: "Complete raw relationships JSON from source"
        meta:
          dimension:
            type: json